name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pylint pytest pytest-asyncio respx
    - name: Analysing the code with pylint
      run: |
        # tests/ gets two extra disables for the standard pytest-fixture-as-
        # parameter idiom (redefined-outer-name, unused-argument); see the
        # rationale in pyproject.toml's [tool.pylint.messages_control] and
        # daz-mcp-server-0t0.
        pylint $(git ls-files '*.py' | grep -v '^tests/')
        pylint --disable=redefined-outer-name,unused-argument $(git ls-files 'tests/*.py')
